<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>3D 解剖 Anatomy</title>
  <meta name="theme-color" content="#0f1720">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="3D 解剖">
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">
  { "imports": {
      "three": "./vendor/three/build/three.module.min.js",
      "three/addons/": "./vendor/three/addons/"
  } }
  </script>
</head>
<body>
  <noscript>請開啟 JavaScript。 Please enable JavaScript.</noscript>
  <header id="top">
    <div class="brand">3D 解剖 <span>Anatomy</span></div>
    <nav id="models" role="tablist" aria-label="Model 模型">
      <button role="tab" data-model="body">全身 <small>Body</small></button>
      <button role="tab" data-model="brain">腦 <small>Brain</small></button>
    </nav>
    <button id="panelToggle" class="icon" aria-label="Panel 面板" aria-expanded="true">☰</button>
  </header>

  <main id="stage">
    <canvas id="view" aria-label="3D view 3D 畫面"></canvas>
    <div id="pins" aria-hidden="true"></div>
    <canvas id="ink" hidden aria-label="Drawing layer 畫筆"></canvas>
    <div id="caption" hidden><b id="captionTitle"></b><span class="more">說明 Notes ▴</span><div id="captionNote"></div></div>
    <div id="loading" hidden><div class="spin"></div><span>載入中 Loading…</span></div>
    <div id="message" hidden></div>

    <div id="hud" hidden></div>

    <div id="chip" hidden>
      <div class="chip-name"><b id="chipZh"></b><span id="chipEn"></span></div>
      <div id="chipInfo"></div>
      <div class="chip-actions">
        <button data-act="focus">對焦 Focus</button>
        <button data-act="isolate">只看此 Isolate</button>
        <button data-act="fade">淡化其他 Fade others</button>
        <button data-act="hide">隱藏 Hide</button>
        <button data-act="pin">標籤 Pin</button>
        <button data-act="close" class="icon" aria-label="Close 關閉">✕</button>
      </div>
    </div>

    <div id="tools">
      <button data-tool="search" title="Search 搜尋 ( / )">⌕<small>搜尋</small></button>
      <button data-tool="reset" title="Reset 重設">⟲<small>重設</small></button>
      <button data-tool="showall" title="Show all 全部顯示">◉<small>全部</small></button>
      <button data-tool="xray" title="X-ray 透視">◌<small>透視</small></button>
      <button data-tool="cut" title="Cut plane 剖面">⊘<small id="cutLabel">剖面</small></button>
      <button data-tool="labels" title="Name labels on/off 名稱標籤">🏷<small>標籤</small></button>
      <button data-tool="unpin" title="Clear labels 清除標籤">⌫<small>清標籤</small></button>
      <button data-tool="pen" title="Draw on the screen 畫筆（關閉即清除）">✎<small>畫筆</small></button>
      <button data-tool="share" title="Share / QR code 分享">⇪<small>分享</small></button>
      <button data-tool="present" title="Consult-room mode: full screen, big text 簡報模式">⛶<small>簡報</small></button>
      <button data-tool="snap" title="Save image 存圖">⎙<small>存圖</small></button>
    </div>
    <div id="share" hidden>
      <div class="share-box">
        <h3>分享此畫面 Share this view</h3>
        <canvas id="qr" aria-label="QR code"></canvas>
        <p id="shareTitle"></p>
        <input id="shareUrl" readonly aria-label="Link 連結">
        <div class="row-btns"><button id="shareCopy">複製連結 Copy link</button><button id="shareClose">關閉 Close</button></div>
        <p class="note" id="shareNote"></p>
      </div>
    </div>
    <div id="search" hidden>
      <div class="search-bar">
        <input id="searchInput" type="search" placeholder="搜尋肌肉、器官、神經… Search muscle, organ, nerve" autocomplete="off" enterkeyhint="search" aria-label="Search 搜尋">
        <button id="searchClose" class="icon" aria-label="Close 關閉">✕</button>
      </div>
      <div id="searchResults" role="listbox"></div>
    </div>
    <div id="cutBar" hidden>
      <input id="cutSlider" type="range" min="-1" max="1" step="0.005" value="0" aria-label="Cut position 剖面位置">
      <button id="cutFlip" class="icon" title="Flip 翻轉">⇄</button>
    </div>
  </main>

  <aside id="panel">
    <button id="sheetBar" aria-label="Menu 選單"><span id="sheetTitle">選單 Menu</span><span class="chev">▼</span></button>
    <div id="tabs" role="tablist"></div>
    <div id="panes"></div>
    <footer id="credit"></footer>
  </aside>

  <script src="vendor/qrcode/qrcode.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
